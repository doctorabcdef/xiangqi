name: Verify Xiangqi website
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm --prefix cloud run build
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: xiangqi-website
          path: dist
